<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Figtree", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: hsl(47, 88%, 63%);
    }

    .card {
      max-width: 300px;
      width: 90%;
      background-color: white;
      border: 2px solid black;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 10px 10px 0px black;
    }

    .illustrator {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 5%;
    }

    .tag {
      background-color: hsl(47, 88%, 63%);
      border-radius: 5px;
      width: 62px;
      padding: 7px;
      font-weight: bold;
    }

    .heading {
      font-size: 20px;
    }

    .content {
      color: gray;
      margin-bottom: 30px;
    }

    .end-section {
      display: flex;
      align-items: center;
    }

    .avatar {
      width: 30px;
      height: 30px;
      margin-right: 15px;
    }

    .name {
      font-weight: bold;
    }

  </style>
</head>
<body>

  <main class="card">
    <img src="./assets/images/illustration-article.svg" alt="Illustration representing HTML and CSS foundations" class="illustrator">
    
    <div class="tag">Learning</div>
    
    <p>Published 21 Dec 2023</p>
    
    <h1 class="heading">HTML & CSS foundations</h1>
    
    <p class="content">
      Those languages are the backbone of every website, defining structure, content, and presentation.
    </p>
    
    <section class="end-section">
      <img src="./assets/images/image-avatar.webp" alt="Greg Hooper avatar" class="avatar">
      
      <span class="name">Greg Hooper</span>
    </section>
  </main>

  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>
</html>
